name: CLI release readiness

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    name: Workflow validation
    # Keep the local-call syntax supported by our pinned actionlint version.
    uses: ./.github/workflows/workflow-validation.yml # zizmor: ignore[self-repository]

  static-checks:
    name: Static and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      # Synthetic public key for clerk.example.com; no live Clerk application.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_SITE_URL: https://spendly.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Renovate configuration
        run: >-
          pnpm --package=renovate@44.115.13 dlx renovate-config-validator
          --strict --no-global renovate.json
      - name: Verify worktree hook installation
        run: pnpm hooks:test
      - name: Check unused code and dependency declarations
        run: pnpm knip:check --reporter github-actions
      - name: Check release metadata and dependency lock
        run: pnpm --dir apps/cli release:check
      - name: Audit production dependencies
        run: |
          pnpm audit --prod --audit-level high
          pnpm --dir apps/cli audit:release
      - name: Check formatting and lint
        run: >-
          pnpm exec biome check
          scripts
          package.json
          renovate.json
          knip.jsonc
          apps/cli/src
          apps/cli/scripts
          apps/cli/package.json
          apps/cli/vitest.config.mts
          apps/cli/tsconfig.json
          apps/cli/tsconfig.development.json
          apps/web/content/docs/cli
          apps/web/scripts/validate-cli-docs.mjs
          apps/web/package.json
          apps/web/vitest.config.mts
          apps/web/playwright.config.ts
          apps/web/e2e
          apps/web/src
          apps/web/test
          packages/backend/package.json
          packages/backend/vitest.config.mts
          packages/backend/convex
          skills/spendly
      - name: Typecheck CLI production and development entries
        run: |
          pnpm --dir apps/cli check-types
          pnpm --dir apps/cli check-types:development
      - name: Typecheck backend
        run: pnpm exec tsc --noEmit -p packages/backend/convex/tsconfig.json
      - name: Generate Web route types
        run: pnpm --dir apps/web exec next typegen
      - name: Typecheck Web
        run: |
          pnpm exec tsc --noEmit -p apps/web/tsconfig.json
          pnpm exec tsc --noEmit -p packages/env/tsconfig.json
      - name: Validate skill and public documentation
        run: |
          node skills/spendly/evals/validate.mjs
          pnpm --dir apps/web docs:validate
      - name: Inspect and install packed CLI
        run: pnpm --dir apps/cli pack:verify

  coverage:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      # Synthetic public key for clerk.example.com; no live Clerk application.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_SITE_URL: https://spendly.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test CLI, backend, and Web with coverage gates
        run: pnpm test:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: |
            apps/cli/coverage
            apps/web/coverage
            packages/backend/coverage
          if-no-files-found: ignore
          retention-days: 14

  web-build:
    name: Web production build and browser smoke
    # Keep the local-call syntax supported by our pinned actionlint version.
    uses: ./.github/workflows/browser-smoke.yml # zizmor: ignore[self-repository]

  quality:
    name: Quality and contract gates
    needs: [workflow-validation, static-checks, coverage, web-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality job to succeed
        env:
          WORKFLOW_VALIDATION_RESULT: ${{ needs.workflow-validation.result }}
          STATIC_CHECKS_RESULT: ${{ needs.static-checks.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
        run: |
          test "$WORKFLOW_VALIDATION_RESULT" = success
          test "$STATIC_CHECKS_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$WEB_BUILD_RESULT" = success

  cli-platforms:
    name: CLI (${{ matrix.os }}, Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      # PRs cover both supported Node versions and operating systems with two jobs.
      # Master pushes and manual runs retain the full release-readiness matrix.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":22},{"os":"macos-latest","node":24}]' || '[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"macos-latest","node":22},{"os":"macos-latest","node":24}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/cli release:check
      - run: pnpm --dir apps/cli check-types
      - run: pnpm --dir apps/cli test
      - run: pnpm --dir apps/cli pack:verify
