name: Build CLI release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to build
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cli-release-candidate
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Freeze verified publication candidate
    if: github.ref == 'refs/heads/master'
    environment: cli-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Require reviewed master and successful release CI
        run: node apps/cli/scripts/verify-release-source.mjs candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
      - run: pnpm install --frozen-lockfile
      - name: Require the requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node apps/cli/scripts/verify-release-metadata.mjs "--expected-version=${RELEASE_VERSION}"
      - name: Verify packed package
        run: pnpm --dir apps/cli pack:verify
      - name: Create the only release tarball
        run: |
          mkdir -p ../../release-artifacts
          npm pack --ignore-scripts --pack-destination ../../release-artifacts
        working-directory: apps/cli
      - name: Record artifact integrity and source commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          sha256sum "release-artifacts/spendly-${RELEASE_VERSION}.tgz" > release-artifacts/SHA256SUMS
          git rev-parse HEAD > release-artifacts/SOURCE_COMMIT
      - name: Confirm build did not change tracked files
        run: git diff --exit-code
      - name: Confirm master still identifies this candidate
        run: node apps/cli/scripts/verify-release-source.mjs candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: spendly-${{ inputs.version }}-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  release-tag:
    name: Tag the verified release commit
    needs: release-candidate
    environment: cli-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # This job installs no dependencies and receives no npm credentials.
      - name: Create or verify the immutable version tag
        run: node apps/cli/scripts/create-release-tag.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
