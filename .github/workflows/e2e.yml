name: E2E regression

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      suite:
        description: Live regression tier
        required: true
        default: full
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

jobs:
  offline:
    name: Secret-free E2E tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:tooling
      - run: pnpm --dir packages/e2e check-types

  live:
    name: Trusted live regression
    permissions:
      contents: read
      id-token: write
    needs: offline
    # Forks NEVER enter this job, even when the repository opts into PR tests.
    # No pull_request_target, unsafe checkout ref, or secrets in the offline job.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       vars.E2E_PR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One dedicated backend is shared across branches. Hold this lock through
    # deploy, both surfaces and teardown, not just through the deploy command.
    concurrency:
      group: spendly-dedicated-e2e-backend
      cancel-in-progress: false
    # REQUIRED repository setup: reviewers + trusted deployment branch policy.
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir packages/e2e exec playwright install --with-deps chromium
      - name: Fetch E2E secrets from Infisical using GitHub OIDC
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/akhilesh-dalvi
          project-slug: spendly
          env-slug: e2e
          domain: https://app.infisical.com
          export-type: env
          secret-path: /
          recursive: false
          include-imports: false
      - name: Validate, deploy this checkout, then run the selected Web and CLI tier
        env:
          E2E_SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'full' }}
          SPENDLY_E2E_ENABLED: "true"
        run: node packages/e2e/run.mjs "$E2E_SUITE"
      - name: Explain failed or canceled execution without uploading credentials
        if: always()
        env:
          LIVE_STATUS: ${{ job.status }}
        run: |
          {
            printf '\nLive job outcome: **%s**.\n' "$LIVE_STATUS"
            printf 'Missing regression steps did not pass. Check setup/install, configuration, backend deploy/typecheck, auth/infrastructure and journey failures separately. A Web failure still permits CLI execution; prerequisite failures stop both surfaces.\n'
            printf 'No traces, screenshots, videos, auth state, journals, environment files or raw deployment output are uploaded. Canceled runners may need scoped orphan recovery; see CONTRIBUTING.md.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: E2E policy gate
    if: always()
    needs: [offline, live]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OFFLINE_RESULT: ${{ needs.offline.result }}
      LIVE_RESULT: ${{ needs.live.result }}
      LIVE_EXPECTED: >-
        ${{ github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             vars.E2E_PR_ENABLED == 'true') }}
    steps:
      - name: Require completed checks for the event's trust policy
        run: |
          if [ "$OFFLINE_RESULT" != success ]; then
            echo 'Secret-free E2E checks did not pass.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$LIVE_EXPECTED" = true ]; then
            if [ "$LIVE_RESULT" != success ]; then
              echo 'Trusted live regression was required by policy but did not pass (failure, cancellation, or skip).' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo 'Offline checks and the required live suite passed (PR smoke; master full; manual selection).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Offline checks passed. Live regression was intentionally NOT run: this event is not opted-in trusted code. This is not live verification.' >> "$GITHUB_STEP_SUMMARY"
          fi
