name: Browser smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Browser smoke (production Chromium)
    # Pin the OS so runner upgrades cannot silently outpace Playwright support.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      # Synthetic public key for clerk.example.com; no live Clerk application.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_SITE_URL: https://spendly.example.com
      NEXT_PUBLIC_SENTRY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm --dir apps/web test:browser:install
      - name: Cache Next.js incremental compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Cache compiler intermediates, never complete release/build output.
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-
      - name: Build production Web
        run: pnpm --dir apps/web build
      - name: Run browser smoke against production server
        run: pnpm --dir apps/web test:browser
      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-diagnostics
          path: |
            apps/web/.next/playwright/report
            apps/web/.next/playwright/results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
